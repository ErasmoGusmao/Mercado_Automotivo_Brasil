[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mercado-automotivo-brasil"
version = "0.1.0"
description = "Pipeline local de análise do mercado automotivo brasileiro (DENATRAN, FENABRAVE/SENATRAN, ANFAVEA, IBGE)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Erasmo Gusmão", email = "erasmo.gusmao@gmail.com" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: testes que tocam rede ou datasets grandes (skip por padrão em dev)",
]
